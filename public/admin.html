<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MeraPartner Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      background: #b65243;
      color: white;
      margin-top: 10px;
    }

    .error {
      color: #c62828;
      margin-top: 12px;
    }

    .dashboard {
      display: none;
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .logout {
      background: #222;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .stat {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat-label {
      color: #777;
      font-size: 14px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 700;
      margin-top: 8px;
    }

    .section {
      background: white;
      margin-top: 25px;
      padding: 25px;
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    th {
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div id="login" class="login">
    <div class="login-box">
      <h1>MeraPartner</h1>
      <p>Admin Dashboard</p>

      <input
        id="password"
        type="password"
        placeholder="Admin password"
      >

      <button
        class="login-btn"
        onclick="login()">
        Login
      </button>

      <div id="error" class="error"></div>
    </div>
  </div>

  <div id="dashboard" class="dashboard">

    <div class="top">
      <div>
        <h1>MeraPartner Admin</h1>
        <p>Marketplace overview</p>
      </div>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          Customers
        </div>
        <div id="customers" class="stat-value">
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Partners
        </div>
        <div id="partners" class="stat-value">
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Bookings
        </div>
        <div id="bookings" class="stat-value">
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Revenue
        </div>
        <div id="revenue" class="stat-value">
          —
        </div>
      </div>

    </div>

    <div class="section">
      <h2>Recent Bookings</h2>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Partner</th>
            <th>Date</th>
            <th>Time</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="bookingRows">
        </tbody>
      </table>
    </div>

  </div>

<script>

async function login() {

  const password =
    document.querySelector("#password").value;

  const error =
    document.querySelector("#error");

  error.textContent = "";

  if (!password) {
    error.textContent =
      "Please enter the admin password.";
    return;
  }

  try {

    const response = await fetch(
      "/api/admin/login",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password })
      }
    );

    const result =
      await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Login failed."
      );
    }

    document.querySelector("#login")
      .style.display = "none";

    document.querySelector("#dashboard")
      .style.display = "block";

    loadDashboard();

  } catch (e) {

    error.textContent = e.message;

  }
}

async function loadDashboard() {

  try {

    const response =
      await fetch("/api/admin/dashboard");

    if (response.status === 401) {
      location.reload();
      return;
    }

    const data =
      await response.json();

    document.querySelector("#customers")
      .textContent = data.customers;

    document.querySelector("#partners")
      .textContent = data.partners;

    document.querySelector("#bookings")
      .textContent = data.bookings;

    document.querySelector("#revenue")
      .textContent =
      "₹" + data.revenue.toLocaleString("en-IN");

    const rows =
      document.querySelector("#bookingRows");

    rows.innerHTML = "";

    data.recentBookings.forEach(
      booking => {

        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td>${booking.customer}</td>
          <td>${booking.partner}</td>
          <td>${booking.date || "-"}</td>
          <td>${booking.time || "-"}</td>
          <td>₹${Number(booking.amount || 0).toLocaleString("en-IN")}</td>
          <td>${booking.status}</td>
        `;

        rows.appendChild(row);
      }
    );

  } catch (e) {

    alert(
      "Could not load dashboard."
    );

  }
}

async function logout() {

  await fetch(
    "/api/admin/logout",
    {
      method: "POST"
    }
  );

  location.reload();
}

</script>

</body>
</html>
